[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-journal"
version = "1.0.0"
description = "Finance Journal — simple CLI income and expense tracker"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
finance-journal = "finance_journal.cli:main"

[tool.setuptools.packages.find]
include = ["finance_journal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
